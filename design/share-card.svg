<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title description">
  <title id="title">qopy — Copy text from your screen.</title>
  <desc id="description">The qopy logo, with an abstract text selection and copy motif, on an off-white background. For macOS 14 and later.</desc>
  <!-- Editable, code-native social card. Palette and QopyMark geometry match src/App.tsx. -->
  <defs>
