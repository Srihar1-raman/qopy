      <feDropShadow dx="0" dy="17" stdDeviation="15" flood-color="#384261" flood-opacity=".09"/>
    </filter>
    <filter id="cursor-shadow" x="-40%" y="-40%" width="190%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#293655" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#faf9f6"/>

