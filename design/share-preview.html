<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>qopy social preview composition</title>
    <style>

    <img class="share-frame" src="./share-preview-frame.svg" alt="qopy — Copy text from your screen. macOS 14+" />

    <script type="module" src="./share-preview.tsx"></script>
